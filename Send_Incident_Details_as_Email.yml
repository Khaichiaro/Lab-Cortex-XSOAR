        format (i.e. ${incident.id} for incident ID).\nAvailable placeholders for
        example:\n- ${incident.labels.Email/from}\n- ${incident.name}\n- ${object.value}\nSee
        incident Context Data menu for available placeholders\n\nNote: Sending emails
        require an active  Mail Sender integration instance."
